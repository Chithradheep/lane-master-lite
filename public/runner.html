<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Lane Runner Prototype</title>
<style>
  html,body{margin:0;height:100%;background:#10131a;overflow:hidden;touch-action:none}
  canvas{display:block;width:100%;height:100%}
  #hud{position:fixed;top:10px;left:12px;font:13px/1.5 ui-monospace,monospace;color:#cbd8ea;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.6)}
  #hud b{font-size:16px;letter-spacing:.04em}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><b id="phaseLabel">Phase 1 / 7</b><br><span id="distLabel">0 m</span><br>← → lanes · ↑/space jump · ↓ slide · swipe on touch</div>
<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const phaseLabel = document.getElementById('phaseLabel');
  const distLabel = document.getElementById('distLabel');
  let W = 0, H = 0, DPR = 1;
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  addEventListener('resize', resize); resize();

  // ---- world constants ----
  const LANE_W = 2.2;
  const LANES = [-LANE_W, 0, LANE_W];
  const CAM_H = 3.4;
  const CAM_Z = -9.5;
  const FOV = 460;
  const HORIZON = () => H * 0.42;
  const DRAW_DIST = 120;

  function proj(x, y, z){
    const dz = z - CAM_Z;
    if (dz <= 0.1) return null;
    const s = FOV / dz;
    return { x: W/2 + x * s, y: HORIZON() + (CAM_H - y) * s, s };
  }

  // ---- phases (placeholder colors) ----
  const PHASES = [
    { name: 'Phase 1', sky:'#151a24', ground:'#1e2735', road:'#2b3547', stripe:'#323e53', obs:'#f0a03a', obsDark:'#c47a23' },
    { name: 'Phase 2', sky:'#0f2420', ground:'#123329', road:'#1b4a3a', stripe:'#215a46', obs:'#7ee081', obsDark:'#3f9c52' },
    { name: 'Phase 3', sky:'#2a1520', ground:'#3a1c2b', road:'#4d2438', stripe:'#5d2c44', obs:'#ff6f91', obsDark:'#c1385c' },
    { name: 'Phase 4', sky:'#101a2e', ground:'#16243f', road:'#1e3157', stripe:'#263c69', obs:'#5ab0ff', obsDark:'#2a6fbd' },
    { name: 'Phase 5', sky:'#2b2410', ground:'#3b3216', road:'#50441e', stripe:'#615325', obs:'#ffe066', obsDark:'#bda32c' },
    { name: 'Phase 6', sky:'#1d1030', ground:'#28173f', road:'#361f55', stripe:'#412665', obs:'#c08bff', obsDark:'#7c4bc4' },
    { name: 'Phase 7', sky:'#2b1208', ground:'#3a190b', road:'#4d2210', stripe:'#5d2a14', obs:'#ff8a4c', obsDark:'#c4501b' },
  ];
  const TOTAL_PHASES = PHASES.length;
  let phase = 0;
  let phaseStart = 0;
  let phaseLen = 0;
  let ended = false;
  const nextLen = () => 350 + Math.random() * 100;

  // flash
  let flash = 0, flashColor = '#ffffff';
  const FLASH_HIT = '255,90,90';
  const FLASH_CLEAR = '255,255,255';
  let flashRGB = FLASH_CLEAR;

  // ---- player ----
  const P = {
    lane: 1, x: LANES[1], y: 0, vy: 0,
    jumping: false, sliding: false, slideT: 0,
    w: 1.0, h: 1.6, invuln: 0, hurt: 0
  };
  const GRAV = -38, JUMP_V = 12.5, SLIDE_TIME = 0.55;

  let speed = 14, dist = 0;

  function jump(){ if (!P.jumping && !ended){ P.jumping = true; P.sliding = false; P.vy = JUMP_V; } }
  function slide(){
    if (ended) return;
    if (!P.jumping){ P.sliding = true; P.slideT = SLIDE_TIME; }
    else P.vy = Math.min(P.vy, -18);
  }
  function move(d){ if(!ended) P.lane = Math.max(0, Math.min(2, P.lane + d)); }

  addEventListener('keydown', e => {
    if (e.repeat) return;
    switch(e.key){
      case 'ArrowLeft': move(-1); e.preventDefault(); break;
      case 'ArrowRight': move(1); e.preventDefault(); break;
      case 'ArrowUp': case ' ': case 'Spacebar': jump(); e.preventDefault(); break;
      case 'ArrowDown': slide(); e.preventDefault(); break;
    }
  }, {passive:false});

  let tx=0, ty=0, tid=null;
  cv.addEventListener('touchstart', e => { const p=e.changedTouches[0]; tx=p.clientX; ty=p.clientY; tid=p.identifier; }, {passive:true});
  cv.addEventListener('touchend', e => {
    for (const p of e.changedTouches){
      if (p.identifier !== tid) continue;
      const dx = p.clientX - tx, dy = p.clientY - ty;
      if (Math.hypot(dx,dy) < 28) continue;
      if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 1 : -1);
      else if (dy < 0) jump(); else slide();
    }
  }, {passive:true});

  // ---- obstacles ----
  const obs = [];
  let nextZ = 40;

  function spawn(){
    const lane = Math.floor(Math.random()*3);
    const type = Math.random() < 0.5 ? 'jump' : 'slide';
    obs.push({
      lane, type, z: nextZ,
      y: type === 'jump' ? 0 : 1.5,
      h: type === 'jump' ? 1.0 : 1.6,
      w: LANE_W * 0.8, d: 1.2
    });
    nextZ += 14 + Math.random()*14 - Math.min(6, speed*0.2);
  }

  function startPhase(i){
    phase = i;
    phaseStart = dist;
    phaseLen = nextLen();
    obs.length = 0;
    nextZ = 45;
    phaseLabel.textContent = `${PHASES[i].name} / ${TOTAL_PHASES}`;
  }

  function advance(byHit){
    flash = 1; flashRGB = byHit ? FLASH_HIT : FLASH_CLEAR;
    if (phase + 1 >= TOTAL_PHASES){
      ended = true;
      phaseLabel.textContent = 'Complete';
      return;
    }
    if (byHit){ P.invuln = 1.4; P.hurt = 0.45; }
    startPhase(phase + 1);
  }

  function hit(o){
    if (o.lane !== P.lane) return false;
    if (o.z + o.d/2 < -0.6 || o.z - o.d/2 > 0.6) return false;
    const ph = P.sliding ? 0.7 : P.h;
    return P.y < o.y + o.h && o.y < P.y + ph;
  }

  // ---- render ----
  function box(x, y, z, w, h, d, top, front){
    const zf = z - d/2, zb = z + d/2;
    const a = proj(x-w/2, y+h, zf), b = proj(x+w/2, y+h, zf);
    const c = proj(x+w/2, y,   zf), e = proj(x-w/2, y,   zf);
    const a2= proj(x-w/2, y+h, zb), b2= proj(x+w/2, y+h, zb);
    if (!a||!b||!c||!e) return;
    if (a2&&b2){ ctx.fillStyle = top; ctx.beginPath();
      ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.lineTo(b2.x,b2.y); ctx.lineTo(a2.x,a2.y);
      ctx.closePath(); ctx.fill(); }
    ctx.fillStyle = front; ctx.beginPath();
    ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.lineTo(c.x,c.y); ctx.lineTo(e.x,e.y);
    ctx.closePath(); ctx.fill();
  }

  function draw(){
    const T = PHASES[Math.min(phase, TOTAL_PHASES-1)];
    ctx.fillStyle = T.sky; ctx.fillRect(0,0,W,H);
    const hz = HORIZON();
    ctx.fillStyle = T.ground; ctx.fillRect(0, hz, W, H - hz);

    const roadHalf = LANE_W*1.5 + 0.4;
    const nf = proj(-roadHalf,0,DRAW_DIST), ff = proj(roadHalf,0,DRAW_DIST);
    const nn = proj(-roadHalf,0,-8), fn = proj(roadHalf,0,-8);
    if (nf&&ff&&nn&&fn){
      ctx.fillStyle = T.road; ctx.beginPath();
      ctx.moveTo(nf.x,nf.y); ctx.lineTo(ff.x,ff.y); ctx.lineTo(fn.x,fn.y); ctx.lineTo(nn.x,nn.y);
      ctx.closePath(); ctx.fill();
    }
    const off = dist % 6;
    for (let z = -8 - off; z < DRAW_DIST; z += 6){
      const p1 = proj(-roadHalf, 0, z), p2 = proj(roadHalf, 0, z);
      const p3 = proj(roadHalf, 0, z+3), p4 = proj(-roadHalf, 0, z+3);
      if(!p1||!p2||!p3||!p4) continue;
      ctx.fillStyle = T.stripe; ctx.beginPath();
      ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.lineTo(p3.x,p3.y); ctx.lineTo(p4.x,p4.y);
      ctx.closePath(); ctx.fill();
    }
    ctx.strokeStyle = 'rgba(255,255,255,.16)'; ctx.lineWidth = 2;
    for (const lx of [-LANE_W/2, LANE_W/2]){
      const p1 = proj(lx,0,-8), p2 = proj(lx,0,DRAW_DIST);
      if(p1&&p2){ ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke(); }
    }

    const sorted = obs.slice().sort((a,b)=>b.z-a.z);
    for (const o of sorted){
      if (o.z > DRAW_DIST || o.z < -8) continue;
      const x = LANES[o.lane];
      if (o.type === 'jump') box(x,o.y,o.z,o.w,o.h,o.d,T.obs,T.obsDark);
      else {
        box(x,o.y,o.z,o.w,o.h,o.d,T.obs,T.obsDark);
        box(x-o.w/2+0.1,0,o.z,0.2,o.y,o.d,T.obsDark,T.obsDark);
        box(x+o.w/2-0.1,0,o.z,0.2,o.y,o.d,T.obsDark,T.obsDark);
      }
    }

    const sp = proj(P.x, 0.01, 0);
    if (sp){
      const r = 26 * (sp.s/FOV) * 12 / (1 + P.y*0.4);
      ctx.fillStyle = 'rgba(0,0,0,.35)';
      ctx.beginPath(); ctx.ellipse(sp.x, sp.y, r*1.2, r*0.45, 0, 0, Math.PI*2); ctx.fill();
    }

    const blink = P.invuln > 0 && Math.floor(P.invuln * 12) % 2 === 0;
    if (!blink){
      const ph = P.sliding ? 0.7 : P.h;
      const pw = P.sliding ? P.w*1.25 : P.w;
      const hurt = P.hurt > 0;
      box(P.x, P.y, 0, pw, ph, P.sliding ? 1.4 : 0.9,
          hurt ? '#ff8a8a' : '#8ee66a', hurt ? '#d94f4f' : '#4faf3c');
    }

    if (flash > 0){
      ctx.fillStyle = `rgba(${flashRGB},${(flash*0.7).toFixed(3)})`;
      ctx.fillRect(0,0,W,H);
    }

    if (ended){
      ctx.fillStyle = 'rgba(0,0,0,.72)'; ctx.fillRect(0,0,W,H);
      ctx.textAlign = 'center'; ctx.fillStyle = '#f2f5fa';
      ctx.font = '600 44px ui-sans-serif,system-ui';
      ctx.fillText('The End', W/2, H/2 - 4);
      ctx.font = '14px ui-monospace,monospace';
      ctx.fillStyle = '#9fb0c7';
      ctx.fillText(`${Math.floor(dist)} m · 7 phases complete`, W/2, H/2 + 26);
      ctx.textAlign = 'left';
    }
  }

  let last = performance.now();
  function loop(now){
    const dt = Math.min((now - last)/1000, 0.05); last = now;

    if (flash > 0) flash = Math.max(0, flash - dt * 2.6);

    if (!ended){
      speed = Math.min(38, speed + dt * 0.45);
      dist += speed * dt;

      P.x += (LANES[P.lane] - P.x) * Math.min(1, dt * 14);

      if (P.jumping){
        P.vy += GRAV * dt; P.y += P.vy * dt;
        if (P.y <= 0){ P.y = 0; P.vy = 0; P.jumping = false; }
      }
      if (P.sliding){ P.slideT -= dt; if (P.slideT <= 0) P.sliding = false; }
      if (P.invuln > 0) P.invuln -= dt;
      if (P.hurt > 0) P.hurt -= dt;

      for (const o of obs) o.z -= speed * dt;
      while (obs.length && obs[0].z < -12) obs.shift();
      nextZ -= speed * dt;
      while (nextZ < DRAW_DIST) spawn();

      if (P.invuln <= 0){
        for (const o of obs){ if (hit(o)){ advance(true); break; } }
      }
      if (!ended && dist - phaseStart >= phaseLen) advance(false);

      distLabel.textContent = `${Math.floor(dist)} m`;
    }

    draw();
    requestAnimationFrame(loop);
  }

  startPhase(0);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
