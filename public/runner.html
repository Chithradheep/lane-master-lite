<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>THE UNLIVED LIFE</title>
<style>
  html,body{margin:0;height:100%;background:#07080b;overflow:hidden;touch-action:none}
  canvas{display:block;width:100%;height:100%}
  #hud{position:fixed;top:12px;left:14px;font:12px/1.6 ui-monospace,monospace;color:#c3cede;
       pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.8);opacity:0;transition:opacity .6s}
  #hud.on{opacity:.85}
  #hud b{display:block;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
  #hud span{color:#8b99ad}
  #again{position:fixed;left:50%;transform:translateX(-50%);bottom:14%;font:12px/1 ui-monospace,monospace;
         color:#6d7a8d;text-decoration:underline;letter-spacing:.08em;cursor:pointer;display:none}
  #again:hover{color:#aab6c6}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><b id="phaseLabel"></b><span id="subLabel"></span></div>
<div id="again">run it again</div>
<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const hud = document.getElementById('hud');
  const phaseLabel = document.getElementById('phaseLabel');
  const subLabel = document.getElementById('subLabel');
  const againEl = document.getElementById('again');

  let W = 0, H = 0, DPR = 1;
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  addEventListener('resize', resize); resize();

  // ---- world ----
  const LANE_W = 2.2, LANES = [-LANE_W, 0, LANE_W];
  const CAM_H = 3.4, CAM_Z = -9.5, FOV = 460, DRAW_DIST = 120;
  const HORIZON = () => H * 0.42;
  function proj(x, y, z){
    const dz = z - CAM_Z;
    if (dz <= 0.1) return null;
    const s = FOV / dz;
    return { x: W/2 + x * s, y: HORIZON() + (CAM_H - y) * s, s };
  }

  // ---- phases ----
  const PHASES = [
    { name:'Childhood', sub:'Surviving Approval',
      sky:'#161307', ground:'#1e1a0f', road:'#2a2415', stripe:'#312a19',
      tint:'138,116,74', haze:0.10, particles:'dust',
      kinds:['exam','face'] },
    { name:'Adolescence', sub:'Surviving Belonging',
      sky:'#0d1319', ground:'#111a22', road:'#18242e', stripe:'#1d2a36',
      tint:'96,120,142', haze:0.12, particles:'motes',
      kinds:['mirror'] },
    { name:'Early Adulthood', sub:'Surviving the System',
      sky:'#0f1412', ground:'#141b18', road:'#1b2521', stripe:'#202b27',
      tint:'96,116,106', haze:0.11, particles:'fog',
      kinds:['bills','turnstile'] },
    { name:'Building a Family', sub:'Surviving Responsibility',
      sky:'#17120e', ground:'#201913', road:'#2c221a', stripe:'#342820',
      tint:'134,106,80', haze:0.10, particles:'dust',
      kinds:['bills','phone'] },
    { name:'Midlife', sub:'Surviving Irrelevance',
      sky:'#14121b', ground:'#1c1926', road:'#262134', stripe:'#2c273c',
      tint:'110,100,132', haze:0.12, particles:'ash',
      kinds:['stamp'] },
    { name:'Decline', sub:'Surviving the Body',
      sky:'#0e1517', ground:'#131d20', road:'#19272a', stripe:'#1e2e32',
      tint:'92,116,120', haze:0.13, particles:'fog',
      kinds:['medical','alarm'] },
    { name:'The Last Breath', sub:'',
      sky:'#05060a', ground:'#07090e', road:'#0a0e15', stripe:'#0d1119',
      tint:'70,80,104', haze:0.14, particles:'embers',
      kinds:[] },
  ];

  const TOTAL = PHASES.length;

  // ---- state ----
  let mode = 'intro';           // intro | play | end
  let phase = 0, phaseStart = 0, phaseLen = 0;
  let speed = 14, dist = 0, moments = 0;
  let flash = 0, flashRGB = '255,255,255';
  const FLASH_HIT = '196,64,64', FLASH_PASS = '236,236,255';
  let introT = 0, endT = 0;
  const obs = [], orbs = [];
  let nextZ = 45, orbPlaced = false;

  const P = { lane:1, x:0, y:0, vy:0, jumping:false, sliding:false, slideT:0,
              w:1.0, h:1.6, invuln:0, hurt:0 };
  const GRAV = -38, JUMP_V = 12.5, SLIDE_TIME = 0.55;

  // ---- input ----
  function jump(){ if (mode==='play' && !P.jumping){ P.jumping = true; P.sliding = false; P.vy = JUMP_V; } }
  function slide(){
    if (mode !== 'play') return;
    if (!P.jumping){ P.sliding = true; P.slideT = SLIDE_TIME; }
    else P.vy = Math.min(P.vy, -18);
  }
  function move(d){ if (mode==='play') P.lane = Math.max(0, Math.min(2, P.lane + d)); }

  addEventListener('keydown', e => {
    if (e.repeat) return;
    if (mode === 'intro' && (e.key === ' ' || e.key === 'Enter')){ begin(); e.preventDefault(); return; }
    switch(e.key){
      case 'ArrowLeft': move(-1); e.preventDefault(); break;
      case 'ArrowRight': move(1); e.preventDefault(); break;
      case 'ArrowUp': case ' ': case 'Spacebar': jump(); e.preventDefault(); break;
      case 'ArrowDown': slide(); e.preventDefault(); break;
    }
  }, {passive:false});

  addEventListener('pointerdown', () => { if (mode === 'intro' && introT > 6.6) begin(); });

  let tx=0, ty=0, tid=null;
  cv.addEventListener('touchstart', e => { const p=e.changedTouches[0]; tx=p.clientX; ty=p.clientY; tid=p.identifier; }, {passive:true});
  cv.addEventListener('touchend', e => {
    for (const p of e.changedTouches){
      if (p.identifier !== tid) continue;
      const dx = p.clientX - tx, dy = p.clientY - ty;
      if (Math.hypot(dx,dy) < 28) continue;
      if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 1 : -1);
      else if (dy < 0) jump(); else slide();
    }
  }, {passive:true});

  againEl.addEventListener('click', () => location.reload());

  // ---- phase flow ----
  const nextLen = () => 350 + Math.random() * 100;

  function startPhase(i){
    phase = i; phaseStart = dist; phaseLen = nextLen();
    obs.length = 0; orbs.length = 0; nextZ = 50; orbPlaced = false;
    const T = PHASES[i];
    phaseLabel.textContent = T.name;
    subLabel.textContent = T.sub;
    if (i === TOTAL - 1) subLabel.textContent = '';
  }

  function advance(byHit){
    flash = 1; flashRGB = byHit ? FLASH_HIT : FLASH_PASS;
    if (byHit){ P.invuln = 1.4; P.hurt = 0.5; }
    if (phase + 1 >= TOTAL) return;
    startPhase(phase + 1);
  }

  function begin(){
    mode = 'play';
    hud.classList.add('on');
    startPhase(0);
  }

  function finish(){
    mode = 'end'; endT = 0;
    hud.classList.remove('on');
  }

  // ---- spawning ----
  function spawn(){
    const T = PHASES[phase];
    if (!T.kinds.length) return;
    const kind = T.kinds[Math.floor(Math.random()*T.kinds.length)];
    const overhead = kind === 'turnstile' || kind === 'mirror' || kind === 'alarm' || kind === 'stamp'
      ? Math.random() < 0.5 : Math.random() < 0.35;
    obs.push({
      kind, lane: Math.floor(Math.random()*3), z: nextZ,
      y: overhead ? 1.5 : 0,
      h: overhead ? 1.6 : 1.05,
      w: LANE_W * 0.8, d: 1.2, overhead,
      spin: Math.random()*6
    });
    nextZ += 14 + Math.random()*14 - Math.min(6, speed*0.2);

    // one rare orb per phase, tucked past the halfway point
    if (!orbPlaced && phase < TOTAL - 1 && dist - phaseStart > phaseLen * 0.35 && Math.random() < 0.25){
      orbPlaced = true;
      orbs.push({ lane: Math.floor(Math.random()*3), z: nextZ + 7, y: 1.15 + Math.random()*1.2, got:false });
    }
  }

  // ---- collision ----
  function hits(o){
    if (o.lane !== P.lane) return false;
    if (o.z + o.d/2 < -0.6 || o.z - o.d/2 > 0.6) return false;
    const ph = P.sliding ? 0.7 : P.h;
    return P.y < o.y + o.h && o.y < P.y + ph;
  }
  function grabs(g){
    if (g.lane !== P.lane || Math.abs(g.z) > 1.0) return false;
    const ph = P.sliding ? 0.7 : P.h;
    return P.y - 0.5 < g.y + 0.45 && g.y - 0.45 < P.y + ph + 0.3;
  }

  // ---- drawing primitives ----
  function box(x, y, z, w, h, d, top, front){
    const zf = z - d/2, zb = z + d/2;
    const a = proj(x-w/2, y+h, zf), b = proj(x+w/2, y+h, zf);
    const c = proj(x+w/2, y, zf), e = proj(x-w/2, y, zf);
    const a2 = proj(x-w/2, y+h, zb), b2 = proj(x+w/2, y+h, zb);
    if (!a||!b||!c||!e) return null;
    if (a2&&b2){ ctx.fillStyle = top; ctx.beginPath();
      ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.lineTo(b2.x,b2.y); ctx.lineTo(a2.x,a2.y);
      ctx.closePath(); ctx.fill(); }
    ctx.fillStyle = front; ctx.beginPath();
    ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.lineTo(c.x,c.y); ctx.lineTo(e.x,e.y);
    ctx.closePath(); ctx.fill();
    return { a, b, c, e };
  }
  function faceRect(o, cb){
    const f = { x:LANES[o.lane], y:o.y, z:o.z, w:o.w, h:o.h };
    const tl = proj(f.x - f.w/2, f.y + f.h, f.z - 0.61);
    const br = proj(f.x + f.w/2, f.y, f.z - 0.61);
    if (!tl || !br) return;
    cb(tl.x, tl.y, br.x - tl.x, br.y - tl.y);
  }

  // ---- themed obstacles ----
  function drawObstacle(o, t){
    const x = LANES[o.lane];
    switch (o.kind){
      case 'exam': {
        box(x, o.y, o.z, o.w, o.h, o.d, '#e9e4d4', '#cfc7b0');
        faceRect(o, (px,py,pw,ph) => {
          ctx.strokeStyle = '#b4321f'; ctx.lineWidth = Math.max(2, pw*0.06);
          ctx.beginPath();
          ctx.moveTo(px+pw*0.25, py+ph*0.25); ctx.lineTo(px+pw*0.75, py+ph*0.75);
          ctx.moveTo(px+pw*0.75, py+ph*0.25); ctx.lineTo(px+pw*0.25, py+ph*0.75);
          ctx.stroke();
          ctx.fillStyle = 'rgba(60,55,45,.5)';
          for (let i=1;i<4;i++) ctx.fillRect(px+pw*0.12, py+ph*(0.1+i*0.05), pw*0.5, Math.max(1,ph*0.015));
        });
        break;
      }
      case 'face': {
        box(x, o.y, o.z, o.w, o.h, o.d, '#8d7a63', '#6f5f4c');
        faceRect(o, (px,py,pw,ph) => {
          ctx.fillStyle = '#231d16';
          const r = Math.max(2, pw*0.07);
          ctx.beginPath(); ctx.arc(px+pw*0.33, py+ph*0.36, r, 0, 7); ctx.fill();
          ctx.beginPath(); ctx.arc(px+pw*0.67, py+ph*0.36, r, 0, 7); ctx.fill();
          ctx.strokeStyle = '#231d16'; ctx.lineWidth = Math.max(2, pw*0.05);
          ctx.beginPath(); ctx.arc(px+pw*0.5, py+ph*0.85, pw*0.26, Math.PI*1.15, Math.PI*1.85); ctx.stroke();
        });
        break;
      }
      case 'mirror': {
        box(x, o.y, o.z, o.w, o.h, o.d, '#9fc8d8', '#6f97ab');
        faceRect(o, (px,py,pw,ph) => {
          const g = ctx.createLinearGradient(px, py, px+pw, py+ph);
          g.addColorStop(0,'rgba(255,255,255,.55)');
          g.addColorStop(0.45 + Math.sin(t*1.6 + o.spin)*0.1,'rgba(150,190,220,.25)');
          g.addColorStop(1,'rgba(255,255,255,.5)');
          ctx.fillStyle = g; ctx.fillRect(px,py,pw,ph);
          ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = Math.max(1,pw*0.03);
          ctx.beginPath();
          ctx.moveTo(px+pw*0.5, py);
          ctx.lineTo(px+pw*(0.5+Math.sin(t*2+o.spin)*0.22), py+ph*0.5);
          ctx.lineTo(px+pw*0.5, py+ph);
          ctx.stroke();
        });
        break;
      }
      case 'bills': {
        const n = 4;
        for (let i=0;i<n;i++){
          const hh = o.h/n;
          box(x + Math.sin(i*2.1)*0.12, o.y + i*hh, o.z, o.w*0.92, hh*0.92, o.d,
              i%2 ? '#efe7cf' : '#dcd2b6', '#b7ac90');
        }
        faceRect(o, (px,py,pw,ph) => {
          ctx.fillStyle = 'rgba(150,40,30,.75)';
          ctx.fillRect(px+pw*0.15, py+ph*0.42, pw*0.7, Math.max(2, ph*0.07));
        });
        break;
      }
      case 'turnstile': {
        box(x, o.y, o.z, o.w, o.h*0.35, o.d, '#7f8a93', '#5b656e');
        box(x-o.w/2, 0, o.z, 0.22, o.y + o.h, o.d, '#4c555d', '#3b434a');
        box(x+o.w/2, 0, o.z, 0.22, o.y + o.h, o.d, '#4c555d', '#3b434a');
        faceRect(o, (px,py,pw,ph) => {
          ctx.strokeStyle = 'rgba(255,200,90,.8)'; ctx.lineWidth = Math.max(2, ph*0.09);
          ctx.beginPath(); ctx.moveTo(px, py+ph*0.6); ctx.lineTo(px+pw, py+ph*0.6); ctx.stroke();
        });
        break;
      }
      case 'phone': {
        box(x, o.y, o.z, o.w*0.8, o.h*0.7, o.d, '#2c2f38', '#1d2028');
        faceRect(o, (px,py,pw,ph) => {
          const on = Math.sin(t*10 + o.spin) > 0;
          ctx.fillStyle = on ? 'rgba(120,220,140,.95)' : 'rgba(70,90,80,.6)';
          ctx.fillRect(px+pw*0.28, py+ph*0.3, pw*0.44, ph*0.4);
          if (on){
            ctx.strokeStyle = 'rgba(120,220,140,.6)'; ctx.lineWidth = 2;
            for (let r=1;r<=2;r++){ ctx.beginPath(); ctx.arc(px+pw*0.5, py+ph*0.5, pw*(0.35*r), 0, 7); ctx.stroke(); }
          }
        });
        break;
      }
      case 'stamp': {
        box(x, o.y, o.z, o.w, o.h*0.8, o.d, '#3a3350', '#282341');
        faceRect(o, (px,py,pw,ph) => {
          ctx.save();
          ctx.translate(px+pw/2, py+ph/2);
          ctx.rotate(-0.22 + Math.sin(t + o.spin)*0.05);
          ctx.strokeStyle = '#e2555f'; ctx.lineWidth = Math.max(2, pw*0.04);
          ctx.strokeRect(-pw*0.42, -ph*0.24, pw*0.84, ph*0.48);
          ctx.fillStyle = '#e2555f';
          ctx.font = `700 ${Math.max(8, pw*0.17)}px ui-sans-serif,system-ui`;
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText('OBSOLETE', 0, 0);
          ctx.restore();
          ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
        });
        break;
      }
      case 'medical': {
        box(x, o.y, o.z, o.w, o.h*0.75, o.d, '#cfd8d6', '#9fb0ad');
        faceRect(o, (px,py,pw,ph) => {
          ctx.fillStyle = '#c0453f';
          ctx.fillRect(px+pw*0.42, py+ph*0.18, pw*0.16, ph*0.5);
          ctx.fillRect(px+pw*0.25, py+ph*0.35, pw*0.5, ph*0.16);
        });
        break;
      }
      case 'alarm': {
        box(x, o.y, o.z, o.w, o.h*0.55, o.d, '#20343a', '#16262b');
        faceRect(o, (px,py,pw,ph) => {
          ctx.strokeStyle = 'rgba(110,230,210,.9)'; ctx.lineWidth = Math.max(2, ph*0.05);
          ctx.beginPath();
          const base = py + ph*0.45;
          ctx.moveTo(px, base);
          for (let i=0;i<=20;i++){
            const u = i/20;
            const spike = Math.exp(-Math.pow((u - ((t*0.55+o.spin)%1))*8, 2));
            ctx.lineTo(px + pw*u, base - spike*ph*0.32);
          }
          ctx.stroke();
        });
        break;
      }
      default: box(x, o.y, o.z, o.w, o.h, o.d, '#888', '#555');
    }
  }

  function drawOrb(g, t){
    const p = proj(LANES[g.lane], g.y + Math.sin(t*1.6)*0.12, g.z);
    if (!p) return;
    const r = Math.max(2, 0.32 * p.s);
    const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r*3.2);
    glow.addColorStop(0, 'rgba(255,248,214,.95)');
    glow.addColorStop(0.3, 'rgba(255,232,160,.35)');
    glow.addColorStop(1, 'rgba(255,220,140,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(p.x, p.y, r*3.2, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,253,240,.95)';
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 7); ctx.fill();
  }

  // ---- scene ----
  // ---- atmosphere: ambient particles, vignette, film grain ----
  const PARTICLE_STYLE = {
    dust:    { n: 70, rgb:'214,198,160', size:[0.6,1.9], alpha:[0.05,0.20], vy:-4,  vx:9,  drift:0.35, blur:0 },
    motes:   { n: 60, rgb:'176,200,224', size:[0.7,2.2], alpha:[0.05,0.18], vy:-6,  vx:6,  drift:0.5,  blur:0 },
    fog:     { n: 26, rgb:'150,168,172', size:[26,74],   alpha:[0.012,0.035], vy:-2, vx:12, drift:0.15, blur:1 },
    ash:     { n: 55, rgb:'196,188,206', size:[0.7,2.0], alpha:[0.05,0.16], vy:9,   vx:5,  drift:0.6,  blur:0 },
    embers:  { n: 40, rgb:'232,196,150', size:[0.8,2.2], alpha:[0.06,0.22], vy:-11, vx:4,  drift:0.4,  blur:0 },
  };
  const rand = (a,b) => a + Math.random()*(b-a);
  let particles = [], particleKind = null;

  function seedParticles(kind){
    particleKind = kind;
    const s = PARTICLE_STYLE[kind] || PARTICLE_STYLE.dust;
    particles = Array.from({length: s.n}, () => ({
      x: Math.random()*W, y: Math.random()*H,
      r: rand(s.size[0], s.size[1]),
      a: rand(s.alpha[0], s.alpha[1]),
      p: Math.random()*Math.PI*2,
      sp: rand(0.6, 1.5)
    }));
  }

  function drawParticles(kind, dt, t){
    if (kind !== particleKind || particles.length === 0) seedParticles(kind);
    const s = PARTICLE_STYLE[kind] || PARTICLE_STYLE.dust;
    for (const q of particles){
      q.y += s.vy * s.sp * dt * (H/700);
      q.x += (s.vx * s.sp * 0.25 + Math.sin(t * s.drift + q.p) * 8) * dt;
      if (q.y < -80) q.y = H + 40;
      if (q.y > H + 80) q.y = -40;
      if (q.x < -90) q.x = W + 60;
      if (q.x > W + 90) q.x = -60;
      ctx.fillStyle = `rgba(${s.rgb},${q.a.toFixed(3)})`;
      if (s.blur){
        const g = ctx.createRadialGradient(q.x, q.y, 0, q.x, q.y, q.r);
        g.addColorStop(0, `rgba(${s.rgb},${(q.a*2.2).toFixed(3)})`);
        g.addColorStop(1, `rgba(${s.rgb},0)`);
        ctx.fillStyle = g;
      }
      ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 7); ctx.fill();
    }
  }

  // grain tile, regenerated occasionally so it shimmers softly
  const grain = document.createElement('canvas');
  grain.width = grain.height = 128;
  const gctx = grain.getContext('2d');
  function refreshGrain(){
    const img = gctx.createImageData(128,128);
    for (let i=0;i<img.data.length;i+=4){
      const v = 120 + Math.random()*135;
      img.data[i] = img.data[i+1] = img.data[i+2] = v;
      img.data[i+3] = 16 + Math.random()*22;
    }
    gctx.putImageData(img, 0, 0);
  }
  refreshGrain();
  let grainT = 0, grainPattern = null;
  function drawGrain(dt){
    grainT += dt;
    if (grainT > 0.09){ grainT = 0; refreshGrain(); grainPattern = null; }
    if (!grainPattern) grainPattern = ctx.createPattern(grain, 'repeat');
    ctx.save();
    ctx.globalAlpha = 0.055;
    ctx.globalCompositeOperation = 'overlay';
    ctx.fillStyle = grainPattern;
    ctx.translate(-(Math.random()*40|0), -(Math.random()*40|0));
    ctx.fillRect(0, 0, W + 60, H + 60);
    ctx.restore();
  }

  let vignetteCache = null, vignetteKey = '';
  function drawVignette(){
    const key = `${W}x${H}`;
    if (key !== vignetteKey){
      vignetteKey = key;
      const g = ctx.createRadialGradient(W/2, H*0.52, Math.min(W,H)*0.22, W/2, H*0.52, Math.max(W,H)*0.78);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(0.6, 'rgba(0,0,0,.24)');
      g.addColorStop(1, 'rgba(4,5,8,.78)');
      vignetteCache = g;
    }
    ctx.fillStyle = vignetteCache; ctx.fillRect(0,0,W,H);
  }

  function colorGrade(T){
    ctx.save();
    ctx.globalCompositeOperation = 'soft-light';
    ctx.fillStyle = `rgba(${T.tint},${(T.haze * 2.4).toFixed(3)})`;
    ctx.fillRect(0,0,W,H);
    ctx.restore();
    // atmospheric haze toward the horizon
    const hz = HORIZON();
    const g = ctx.createLinearGradient(0, hz - H*0.12, 0, hz + H*0.30);
    g.addColorStop(0, `rgba(${T.tint},0)`);
    g.addColorStop(0.42, `rgba(${T.tint},${T.haze.toFixed(3)})`);
    g.addColorStop(1, `rgba(${T.tint},0)`);
    ctx.fillStyle = g; ctx.fillRect(0, hz - H*0.12, W, H*0.42);
  }

  function drawWorld(t, dt = 0){

    const T = PHASES[phase];
    ctx.fillStyle = T.sky; ctx.fillRect(0,0,W,H);
    const hz = HORIZON();
    ctx.fillStyle = T.ground; ctx.fillRect(0, hz, W, H - hz);

    const roadHalf = LANE_W*1.5 + 0.4;
    const nf = proj(-roadHalf,0,DRAW_DIST), ff = proj(roadHalf,0,DRAW_DIST);
    const nn = proj(-roadHalf,0,-8), fn = proj(roadHalf,0,-8);
    if (nf&&ff&&nn&&fn){
      ctx.fillStyle = T.road; ctx.beginPath();
      ctx.moveTo(nf.x,nf.y); ctx.lineTo(ff.x,ff.y); ctx.lineTo(fn.x,fn.y); ctx.lineTo(nn.x,nn.y);
      ctx.closePath(); ctx.fill();
    }
    const off = dist % 6;
    for (let z = -8 - off; z < DRAW_DIST; z += 6){
      const p1 = proj(-roadHalf,0,z), p2 = proj(roadHalf,0,z);
      const p3 = proj(roadHalf,0,z+3), p4 = proj(-roadHalf,0,z+3);
      if(!p1||!p2||!p3||!p4) continue;
      ctx.fillStyle = T.stripe; ctx.beginPath();
      ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.lineTo(p3.x,p3.y); ctx.lineTo(p4.x,p4.y);
      ctx.closePath(); ctx.fill();
    }
    ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 2;
    for (const lx of [-LANE_W/2, LANE_W/2]){
      const p1 = proj(lx,0,-8), p2 = proj(lx,0,DRAW_DIST);
      if(p1&&p2){ ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke(); }
    }

    for (const o of obs.slice().sort((a,b)=>b.z-a.z)){
      if (o.z > DRAW_DIST || o.z < -8) continue;
      drawObstacle(o, t);
    }
    for (const g of orbs) if (!g.got && g.z < DRAW_DIST && g.z > -6) drawOrb(g, t);

    const sp = proj(P.x, 0.01, 0);
    if (sp){
      const r = 26 * (sp.s/FOV) * 12 / (1 + P.y*0.4);
      ctx.fillStyle = 'rgba(0,0,0,.35)';
      ctx.beginPath(); ctx.ellipse(sp.x, sp.y, r*1.2, r*0.45, 0, 0, 7); ctx.fill();
    }
    const blink = P.invuln > 0 && Math.floor(P.invuln * 12) % 2 === 0;
    if (!blink){
      const ph = P.sliding ? 0.7 : P.h;
      const pw = P.sliding ? P.w*1.25 : P.w;
      const hurt = P.hurt > 0;
      box(P.x, P.y, 0, pw, ph, P.sliding ? 1.4 : 0.9,
          hurt ? '#e8b3b3' : '#dfe7f2', hurt ? '#b4595b' : '#9aa8bd');
    }

    if (flash > 0){
      ctx.fillStyle = `rgba(${flashRGB},${(flash*0.65).toFixed(3)})`;
      ctx.fillRect(0,0,W,H);
    }
  }

  const INTRO_LINES = [
    { t: 1.2, s: 'He is lying in his bed.' },
    { t: 3.4, s: 'The room is quiet.' },
    { t: 5.6, s: 'His breathing is slowing.' },
  ];

  function drawIntro(t){
    ctx.fillStyle = '#05060a'; ctx.fillRect(0,0,W,H);
    const pulse = 0.5 + 0.5 * Math.sin(t * 0.9);
    const r = Math.min(W,H) * (0.28 + pulse * 0.07);
    const g = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, r);
    g.addColorStop(0, `rgba(150,170,205,${0.10 + pulse*0.09})`);
    g.addColorStop(1, 'rgba(10,12,18,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(W/2, H/2, r, 0, 7); ctx.fill();

    ctx.textAlign = 'center';
    ctx.font = '300 20px ui-sans-serif,system-ui';
    INTRO_LINES.forEach((l, i) => {
      const a = Math.min(1, Math.max(0, (introT - l.t) / 1.1));
      if (a <= 0) return;
      ctx.fillStyle = `rgba(223,231,242,${a * 0.9})`;
      ctx.fillText(l.s, W/2, H/2 - 34 + i * 34);
    });
    if (introT > 6.6){
      const a = 0.35 + 0.35 * Math.sin(t*1.6);
      ctx.font = '12px ui-monospace,monospace';
      ctx.fillStyle = `rgba(150,163,182,${a})`;
      ctx.fillText('click when you\u2019re ready', W/2, H/2 + 108);
    }
    ctx.textAlign = 'left';
  }

  function drawEnd(){
    drawWorld(0);
    const fade = Math.min(1, endT / 1.6);
    ctx.fillStyle = `rgba(4,5,8,${fade})`; ctx.fillRect(0,0,W,H);
    ctx.textAlign = 'center';
    const a1 = Math.min(1, Math.max(0, (endT - 1.8) / 1.4));
    if (a1 > 0){
      ctx.fillStyle = `rgba(216,224,236,${a1 * 0.9})`;
      ctx.font = '300 18px ui-sans-serif,system-ui';
      const line = `He gathered ${moments} moment${moments === 1 ? '' : 's'} of presence, across a lifetime`;
      ctx.fillText(line, W/2, H/2 - 18);
      ctx.fillText('spent running from 6 different things.', W/2, H/2 + 10);
    }
    const a2 = Math.min(1, Math.max(0, (endT - 5.4) / 1.6));
    if (a2 > 0){
      ctx.fillStyle = `rgba(226,232,242,${a2 * 0.92})`;
      ctx.font = '300 22px ui-sans-serif,system-ui';
      ctx.fillText('Did he live?', W/2, H/2 + 78);
    }
    ctx.textAlign = 'left';
    if (endT > 8 && againEl.style.display !== 'block') againEl.style.display = 'block';
  }

  // ---- loop ----
  let last = performance.now(), t = 0;
  function loop(now){
    const dt = Math.min((now - last)/1000, 0.05); last = now; t += dt;
    if (flash > 0) flash = Math.max(0, flash - dt * 2.6);

    if (mode === 'intro'){
      introT += dt;
      drawIntro(t);
    } else if (mode === 'play'){
      const lastPhase = phase === TOTAL - 1;

      if (lastPhase){
        speed = Math.max(0, speed - dt * 2.6);
        if (speed <= 0.05){ speed = 0; finish(); }
      } else {
        speed = Math.min(38, speed + dt * 0.45);
      }
      dist += speed * dt;

      P.x += (LANES[P.lane] - P.x) * Math.min(1, dt * 14);
      if (P.jumping){
        P.vy += GRAV * dt; P.y += P.vy * dt;
        if (P.y <= 0){ P.y = 0; P.vy = 0; P.jumping = false; }
      }
      if (P.sliding){ P.slideT -= dt; if (P.slideT <= 0) P.sliding = false; }
      if (P.invuln > 0) P.invuln -= dt;
      if (P.hurt > 0) P.hurt -= dt;

      for (const o of obs) o.z -= speed * dt;
      for (const g of orbs) g.z -= speed * dt;
      while (obs.length && obs[0].z < -12) obs.shift();

      if (!lastPhase){
        nextZ -= speed * dt;
        while (nextZ < DRAW_DIST) spawn();
        if (P.invuln <= 0){
          for (const o of obs){ if (hits(o)){ advance(true); break; } }
        }
      }
      for (const g of orbs){ if (!g.got && grabs(g)){ g.got = true; moments++; } }

      if (mode === 'play' && !lastPhase && dist - phaseStart >= phaseLen) advance(false);

      drawWorld(t);
    } else {
      endT += dt;
      drawEnd();
    }

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
