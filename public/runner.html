<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Lane Runner Prototype</title>
<style>
  html,body{margin:0;height:100%;background:#10131a;overflow:hidden;touch-action:none}
  canvas{display:block;width:100%;height:100%}
  #hud{position:fixed;top:10px;left:12px;font:13px/1.4 ui-monospace,monospace;color:#8fa3bf;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">← → lanes · ↑/space jump · ↓ slide · swipe on touch</div>
<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  addEventListener('resize', resize); resize();

  // ---- world constants ----
  const LANE_W = 2.2;               // world units
  const LANES = [-LANE_W, 0, LANE_W];
  const CAM_H = 3.4;                // camera height
  const CAM_Z = -9.5;               // camera behind player
  const FOV = 460;                  // projection scale
  const HORIZON = () => H * 0.42;
  const DRAW_DIST = 120;

  function proj(x, y, z){
    const dz = z - CAM_Z;
    if (dz <= 0.1) return null;
    const s = FOV / dz;
    return { x: W/2 + x * s, y: HORIZON() + (CAM_H - y) * s, s };
  }

  // ---- player ----
  const P = {
    lane: 1, x: LANES[1], y: 0, vy: 0,
    jumping: false, sliding: false, slideT: 0,
    w: 1.0, h: 1.6, dead: false, deadT: 0
  };
  const GRAV = -38, JUMP_V = 13.5, SLIDE_TIME = 0.55;

  let speed = 14, dist = 0, t = 0;

  function jump(){ if (!P.jumping && !P.dead){ P.jumping = true; P.sliding = false; P.vy = JUMP_V; } }
  function slide(){ if (!P.dead && !P.jumping){ P.sliding = true; P.slideT = SLIDE_TIME; }
                    else if (!P.dead && P.jumping){ P.vy = Math.min(P.vy, -18); } }
  function move(d){ if(!P.dead) P.lane = Math.max(0, Math.min(2, P.lane + d)); }

  addEventListener('keydown', e => {
    if (e.repeat) return;
    switch(e.key){
      case 'ArrowLeft': move(-1); e.preventDefault(); break;
      case 'ArrowRight': move(1); e.preventDefault(); break;
      case 'ArrowUp': case ' ': case 'Spacebar': jump(); e.preventDefault(); break;
      case 'ArrowDown': slide(); e.preventDefault(); break;
    }
  }, {passive:false});

  let tx=0, ty=0, tid=null;
  cv.addEventListener('touchstart', e => { const p=e.changedTouches[0]; tx=p.clientX; ty=p.clientY; tid=p.identifier; }, {passive:true});
  cv.addEventListener('touchend', e => {
    for (const p of e.changedTouches){
      if (p.identifier !== tid) continue;
      const dx = p.clientX - tx, dy = p.clientY - ty;
      if (Math.hypot(dx,dy) < 28) continue;
      if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 1 : -1);
      else if (dy < 0) jump(); else slide();
    }
  }, {passive:true});

  // ---- obstacles ----
  // type 'jump'  -> low block on ground, must jump
  // type 'slide' -> overhead bar, must slide
  const obs = [];
  let nextZ = 40;

  function spawn(){
    const lane = Math.floor(Math.random()*3);
    const type = Math.random() < 0.5 ? 'jump' : 'slide';
    obs.push({
      lane, type, z: nextZ,
      y: type === 'jump' ? 0 : 1.5,
      h: type === 'jump' ? 1.0 : 1.6,
      w: LANE_W * 0.8, d: 1.2
    });
    nextZ += 14 + Math.random()*14 - Math.min(6, speed*0.2);
  }

  function reset(){
    obs.length = 0; nextZ = 40; speed = 14; dist = 0;
    P.lane = 1; P.x = LANES[1]; P.y = 0; P.vy = 0;
    P.jumping = false; P.sliding = false; P.dead = false; P.deadT = 0;
  }

  function hit(o){
    if (o.lane !== P.lane) return false;
    const pz0 = 0 - 0.6, pz1 = 0 + 0.6;      // player occupies z ~ [-0.6,0.6]
    if (o.z + o.d/2 < pz0 || o.z - o.d/2 > pz1) return false;
    const ph = P.sliding ? 0.7 : P.h;
    const py0 = P.y, py1 = P.y + ph;
    const oy0 = o.y, oy1 = o.y + o.h;
    return py0 < oy1 && oy0 < py1;
  }

  // ---- render helpers ----
  function box(x, y, z, w, h, d, top, front){
    const zf = z - d/2, zb = z + d/2;
    const a = proj(x-w/2, y+h, zf), b = proj(x+w/2, y+h, zf);
    const c = proj(x+w/2, y,   zf), e = proj(x-w/2, y,   zf);
    const a2= proj(x-w/2, y+h, zb), b2= proj(x+w/2, y+h, zb);
    if (!a||!b||!c||!e) return;
    if (a2&&b2){ ctx.fillStyle = top; ctx.beginPath();
      ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.lineTo(b2.x,b2.y); ctx.lineTo(a2.x,a2.y);
      ctx.closePath(); ctx.fill(); }
    ctx.fillStyle = front; ctx.beginPath();
    ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.lineTo(c.x,c.y); ctx.lineTo(e.x,e.y);
    ctx.closePath(); ctx.fill();
  }

  function draw(){
    // sky + ground
    ctx.fillStyle = '#151a24'; ctx.fillRect(0,0,W,H);
    const hz = HORIZON();
    ctx.fillStyle = '#1e2735'; ctx.fillRect(0, hz, W, H - hz);

    // road quad
    const roadHalf = LANE_W*1.5 + 0.4;
    const nf = proj(-roadHalf,0,DRAW_DIST), ff = proj(roadHalf,0,DRAW_DIST);
    const nn = proj(-roadHalf,0,-4), fn = proj(roadHalf,0,-4);
    if (nf&&ff&&nn&&fn){
      ctx.fillStyle = '#2b3547'; ctx.beginPath();
      ctx.moveTo(nf.x,nf.y); ctx.lineTo(ff.x,ff.y); ctx.lineTo(fn.x,fn.y); ctx.lineTo(nn.x,nn.y);
      ctx.closePath(); ctx.fill();
    }
    // moving ground stripes
    const off = dist % 6;
    for (let z = -4 - off; z < DRAW_DIST; z += 6){
      const p1 = proj(-roadHalf, 0, z), p2 = proj(roadHalf, 0, z);
      const p3 = proj(roadHalf, 0, z+3), p4 = proj(-roadHalf, 0, z+3);
      if(!p1||!p2||!p3||!p4) continue;
      ctx.fillStyle = '#323e53'; ctx.beginPath();
      ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.lineTo(p3.x,p3.y); ctx.lineTo(p4.x,p4.y);
      ctx.closePath(); ctx.fill();
    }
    // lane dividers
    ctx.strokeStyle = 'rgba(255,255,255,.16)'; ctx.lineWidth = 2;
    for (const lx of [-LANE_W/2, LANE_W/2]){
      const p1 = proj(lx,0,-4), p2 = proj(lx,0,DRAW_DIST);
      if(p1&&p2){ ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke(); }
    }

    // obstacles far -> near
    const sorted = obs.slice().sort((a,b)=>b.z-a.z);
    for (const o of sorted){
      if (o.z > DRAW_DIST || o.z < -5) continue;
      const x = LANES[o.lane];
      if (o.type === 'jump') box(x,o.y,o.z,o.w,o.h,o.d,'#f0a03a','#c47a23');
      else {
        box(x,o.y,o.z,o.w,o.h,o.d,'#4ec3d9','#2b8ea6');
        // legs
        box(x-o.w/2+0.1,0,o.z,0.2,o.y,o.d,'#2b8ea6','#22708a');
        box(x+o.w/2-0.1,0,o.z,0.2,o.y,o.d,'#2b8ea6','#22708a');
      }
    }

    // player shadow
    const sp = proj(P.x, 0.01, 0);
    if (sp){
      const r = 26 * (sp.s/FOV) * 12 / (1 + P.y*0.4);
      ctx.fillStyle = 'rgba(0,0,0,.35)';
      ctx.beginPath(); ctx.ellipse(sp.x, sp.y, r*1.2, r*0.45, 0, 0, Math.PI*2); ctx.fill();
    }
    // player
    const ph = P.sliding ? 0.7 : P.h;
    const pw = P.sliding ? P.w*1.25 : P.w;
    box(P.x, P.y, 0, pw, ph, P.sliding ? 1.4 : 0.9,
        P.dead ? '#ff8a8a' : '#8ee66a', P.dead ? '#d94f4f' : '#4faf3c');

    if (P.dead){
      ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(0,0,W,H);
      ctx.fillStyle = '#e8eef7'; ctx.textAlign = 'center';
      ctx.font = '600 28px ui-sans-serif,system-ui';
      ctx.fillText('Crash', W/2, H/2 - 6);
      ctx.font = '14px ui-monospace,monospace';
      ctx.fillText('restarting…', W/2, H/2 + 20);
      ctx.textAlign = 'left';
    }
  }

  let last = performance.now();
  function loop(now){
    let dt = Math.min((now - last)/1000, 0.05); last = now; t += dt;

    if (!P.dead){
      speed = Math.min(38, speed + dt * 0.45);
      dist += speed * dt;

      // lane lerp
      const target = LANES[P.lane];
      P.x += (target - P.x) * Math.min(1, dt * 14);

      // jump
      if (P.jumping){
        P.vy += GRAV * dt; P.y += P.vy * dt;
        if (P.y <= 0){ P.y = 0; P.vy = 0; P.jumping = false; }
      }
      // slide
      if (P.sliding){ P.slideT -= dt; if (P.slideT <= 0) P.sliding = false; }

      // obstacles
      for (const o of obs) o.z -= speed * dt;
      while (obs.length && obs[0].z < -8) obs.shift();
      nextZ -= speed * dt;
      while (nextZ < DRAW_DIST) spawn();

      for (const o of obs){ if (hit(o)){ P.dead = true; P.deadT = 0; break; } }
    } else {
      P.deadT += dt;
      if (P.deadT > 1.1) reset();
    }

    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
